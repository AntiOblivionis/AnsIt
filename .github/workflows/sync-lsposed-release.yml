name: Sync LSPosed release

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      verify_only:
        description: Verify releases without writing to the module repository
        type: boolean
        default: false
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read

concurrency:
  group: lsposed-release-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the trusted default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Test sync behavior
        run: python3 -m unittest discover -s .github/tests -p 'test_*.py' -v
      - name: Verify and sync published releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
          XPOSED_SYNC_TOKEN: ${{ secrets.XPOSED_SYNC_TOKEN }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
        run: python3 .github/scripts/sync_lsposed_release.py
