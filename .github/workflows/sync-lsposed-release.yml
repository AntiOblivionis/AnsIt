name: Sync LSPosed release

on:
  push:
    branches: [main]
    paths:
      - README.md
      - LICENSE
      - design/ansit-icon.svg
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      verify_only:
        description: Verify releases without writing to the module repository
        type: boolean
        default: false
      verify_write:
        description: Verify token write access without changing release content
        type: boolean
        default: false
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read

concurrency:
  group: lsposed-release-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the trusted default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Test sync behavior
        run: python3 -m unittest discover -s .github/tests -p 'test_*.py' -v
      - name: Verify and sync published releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
          XPOSED_SYNC_TOKEN: ${{ secrets.XPOSED_SYNC_TOKEN }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
          VERIFY_WRITE: ${{ inputs.verify_write }}
        run: python3 .github/scripts/sync_lsposed_release.py
