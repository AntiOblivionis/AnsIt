plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}
android {
    namespace 'com.antioblivionis.ansit'
    compileSdk 35
    defaultConfig { applicationId 'com.antioblivionis.ansit'; minSdk 31; targetSdk 35; versionCode 15; versionName '0.8.4' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true; buildConfig true }
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/licenseAssets'))
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'ansit.renderDir', rootProject.file('artifacts/ui-0.8.4').absolutePath
        }
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
def generateLicenseAssets = tasks.register('generateLicenseAssets', Copy) {
    from(rootProject.file('LICENSE'))
    into(layout.buildDirectory.dir('generated/licenseAssets'))
}
tasks.named('preBuild').configure { dependsOn(generateLicenseAssets) }
apply from: rootProject.file('gradle/release-signing.gradle')
dependencies {
    implementation platform('androidx.compose:compose-bom:2025.05.01')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.1'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    compileOnly 'de.robv.android.xposed:api:82'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    testImplementation 'com.squareup.okhttp3:mockwebserver:3.14.9'
    testImplementation 'org.robolectric:robolectric:4.15.1'
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
